<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <style>
    .bg { fill: #0f172a }
    .card { fill: #fff; stroke: #e6e9ef; rx: 8 }
    .title { font: 600 20px/1.2 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; fill: #0f172a }
    .meta { font: 400 12px/1.2 'Inter'; fill: #6b7280 }
    .task { font: 500 14px 'Inter'; fill: #111827 }
    .dot { fill: #7c3aed }

    .pulse { animation: pulse 1.6s infinite ease-in-out }
    @keyframes pulse {
      0% { transform: translateY(0); opacity: 1 }
      50% { transform: translateY(-6px); opacity: 0.7 }
      100% { transform: translateY(0); opacity: 1 }
    }

    .expand { transform-origin: 190px 150px; animation: expand 2s forwards }
    @keyframes expand {
      0% { transform: scaleY(1) }
      40% { transform: scaleY(1.02) }
      100% { transform: scaleY(1) }
    }

    .check { stroke: #10b981; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 18; stroke-dashoffset: 18; animation: draw 1s 1.1s forwards }
    @keyframes draw { to { stroke-dashoffset: 0 } }

    .cursor { fill: #111827; opacity: 0.95; transform-origin: 60px 60px; animation: moveCursor 2s forwards }
    @keyframes moveCursor {
      0% { transform: translate(0,0) }
      30% { transform: translate(150px,50px) }
      60% { transform: translate(150px,50px) }
      100% { transform: translate(0,0) }
    }
  </style>

  <rect width="900" height="300" class="bg" rx="8" />

  <!-- Left: projects list (static) -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="260" height="260" class="card" rx="10" />
    <text x="18" y="32" class="title">Projects</text>
    <text x="18" y="52" class="meta">14 projects</text>

    <g transform="translate(18,80)">
      <rect x="0" y="0" width="220" height="42" rx="6" fill="#f8fafc" />
      <text x="12" y="26" class="task">Garden Weather Station</text>
      <circle cx="200" cy="20" r="6" class="dot pulse" />
    </g>

    <g transform="translate(18,140)">
      <rect x="0" y="0" width="220" height="42" rx="6" fill="#ffffff" />
      <text x="12" y="26" class="task">Energy Monitor Pipeline</text>
    </g>
  </g>

  <!-- Middle card that expands slightly when clicked -->
  <g transform="translate(310,20)" class="expand">
    <rect x="0" y="0" width="580" height="120" class="card" rx="10" />
    <text x="18" y="32" class="title">Garden Weather Station</text>
    <text x="18" y="54" class="meta">ESP32-S3 · BME280 · VEML6075 · ESPHome · MQTT</text>

    <!-- tasks list -->
    <g id="tasks" transform="translate(18,78)">
      <rect x="0" y="0" width="520" height="44" rx="6" fill="#ffffff" />
      <text x="12" y="28" class="task">Design IP65 enclosure</text>

      <g transform="translate(460,10)">
        <!-- checkbox that will animate -->
        <rect x="0" y="0" width="22" height="22" rx="4" fill="#f1f5f9" stroke="#e6e9ef" />
        <path class="check" d="M4 12 L9 17 L18 6" />
      </g>
    </g>
  </g>

  <!-- cursor (simple triangle) -->
  <g transform="translate(0,0)">
    <polygon class="cursor" points="0,0 12,8 4,10 6,18 0,0" />
  </g>

</svg>