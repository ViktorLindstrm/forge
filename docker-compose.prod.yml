services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge_prod
    volumes:
      - /mnt/tank/forge/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/GITHUB_OWNER/forge:RELEASE_TAG
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PHX_SERVER: "true"
      PHX_HOST: "192.168.1.x"
      PORT: "4000"
      DATABASE_URL: "ecto://forge:forge@db/forge_prod"
      POOL_SIZE: "10"
