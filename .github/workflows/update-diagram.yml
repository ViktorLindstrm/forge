name: Update architecture diagram

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

env:
  ELIXIR_VERSION: "1.20.0-rc.3"
  OTP_VERSION: "28.1"
  MIX_ENV: dev

jobs:
  update-diagram:
    name: Regenerate architecture diagram
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Generate architecture diagram
        run: mix forge.gen_diagram

      - name: Commit diagram if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.md
          git diff --cached --quiet || (
            git commit -m "chore: update architecture diagram [skip ci]" &&
            git push origin HEAD:${{ github.head_ref }}
          )
